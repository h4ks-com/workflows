{% extends "base.html" %}
{% block title %}{{ username }} · h4ks workflows{% endblock %}
{% block content %}
<section class="page">
<h1>{{ username }}</h1>
<div class="panel">
  <span class="label">job history</span>
  <div class="feed">
    {% for job in jobs %}
    {% include "_result_row.html" %}
    {% else %}
    <p class="muted">no jobs yet. <a href="/#create">create one</a>.</p>
    {% endfor %}
  </div>
</div>
</section>
{% endblock %}
