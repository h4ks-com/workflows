{% extends "base.html" %}
{% block title %}confirm job · h4ks workflows{% endblock %}
{% block content %}
<section class="page">
<div class="panel">
  <span class="label">confirm your job</span>
  <h1>~/{{ job_type.name }}</h1>
  <p class="muted">{{ job_type.description }}</p>
  <div class="kv"><span>price</span><span>{{ job.quote }} credits</span></div>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {% if job.identity %}
    <label class="row" style="font:13px var(--mono);color:var(--mid)"><input type="checkbox" name="link_account" value="true" style="width:auto" checked> link {{ job.identity }} to your account</label>
    {% endif %}
    <button type="submit" class="btn">confirm and pay</button>
  </form>
</div>
</section>
{% endblock %}
