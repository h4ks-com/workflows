services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEV_LOGIN: "true"
      SESSION_SECRET: local-session-secret
      BASE_URL: http://localhost:8000
      SERVICE_TOKEN: local-service-token
      WORKFLOWS_ADMIN_USERS: admin
      WORKFLOWS_EXECUTOR_TOKEN: fake-executor-key
      N8N_URL: http://localhost:9000
      YTDL_URL: http://localhost:9000
      YTDL_API_KEY: fake-executor-key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The executor shares the app's network so both reach each other on localhost,
  # which keeps BASE_URL usable from the browser too.
  executor:
    build: ./e2e/fake_executor
    network_mode: service:app
    environment:
      FAKE_EXECUTOR_API_KEY: fake-executor-key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9000/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 15
    depends_on:
      app:
        condition: service_started
