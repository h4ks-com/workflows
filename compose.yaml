services:
  executor:
    build: ./e2e/fake_executor
    environment:
      FAKE_EXECUTOR_API_KEY: fake-executor-key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9000/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEV_LOGIN: "true"
      SESSION_SECRET: e2e-session-secret
      BASE_URL: http://app:8000
      SERVICE_TOKEN: e2e-service-token
      WORKFLOWS_ADMIN_USERS: root
      WORKFLOWS_EXECUTOR_TOKEN: fake-executor-key
      EXECUTOR_URL_PARODY: http://executor:9000/dispatch
      EXECUTOR_URL_SONG: http://executor:9000/dispatch
      YTDL_URL: http://executor:9000
      YTDL_API_KEY: fake-executor-key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 15
    depends_on:
      executor:
        condition: service_healthy
