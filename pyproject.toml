[project]
name = "workflows"
version = "0.0.0"
description = "Paid AI media job queue for the h4ks community"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.7.0",
    "pydantic==2.13.5",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy==2.0.54",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "authlib==1.8.0",
    "itsdangerous==2.2.0",
    "sse-starlette==3.4.11",
    "fastmcp==4.0.5",
    "python-multipart==0.0.32",
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "vulture==2.16",
    "deptry==0.25.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflows"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "RUF", "C90", "PLR"]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 10
max-returns = 6
max-statements = 40
max-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
files = ["src/workflows", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["workflows"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = ["^\\s*\\.\\.\\.$"]

[tool.vulture]
min_confidence = 80

[tool.deptry]
known_first_party = ["workflows"]
per_rule_ignores = { "DEP002" = ["uvicorn", "jinja2", "authlib", "itsdangerous", "sse-starlette", "fastmcp", "python-multipart"] }

[tool.bandit]
exclude_dirs = ["tests"]
